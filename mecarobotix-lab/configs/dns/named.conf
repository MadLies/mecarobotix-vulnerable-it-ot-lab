acl "internal" {
    127.0.0.0/8;
    10.10.10.0/24;  // DMZ
    10.10.20.0/24;  // Identity
    10.10.30.0/24;  // DEV/CI
    10.10.40.0/24;  // IT
    10.10.50.0/24;  // OT
    10.10.100.0/24; // Users
};

options {
    directory "/var/cache/bind";
    allow-query { internal; };
    recursion yes;
    allow-recursion { internal; };
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    version "not currently available";
};

zone "mecarobotix.local" IN {
    type master;
    file "/etc/bind/db.mecarobotix.local";
    allow-transfer { none; }; 
};
