server {
    listen 443 ssl;
    server_name artifact-registry artifact-registry.mecarobotix.local artifacts.mecarobotix.local;

    ssl_certificate /etc/mecarobotix/tls/tls-chain.crt;
    ssl_certificate_key /etc/mecarobotix/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri =404;
    }
}
