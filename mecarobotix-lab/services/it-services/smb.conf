[global]
   server role = standalone server
   workgroup = MECAROBOTIX
   netbios name = ITSERVICES
   security = user
   map to guest = Never
   passdb backend = tdbsam
   server min protocol = SMB2_02
   server max protocol = SMB3

   logging = stdout
   log level = 2
   lock directory = /var/cache/samba
   state directory = /var/lib/samba
   cache directory = /var/cache/samba
   pid directory = /var/run/samba

   load printers = no
   disable spoolss = yes
   smb ports = 445

[shared-files]
   path = /srv/share
   browseable = yes
   read only = yes
   guest ok = no
   valid users = smbByLdapUser
