listen=YES
listen_ipv6=NO

anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/share
anon_upload_enable=NO
anon_mkdir_write_enable=NO

local_enable=YES
write_enable=NO
local_root=/srv/share
chroot_local_user=YES
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

seccomp_sandbox=NO
utf8_filesystem=YES
xferlog_enable=YES
dual_log_enable=YES
